[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stubborn"
version = "0.9.0b2"
description = "Deterministic code context from symbol graphs — not vector search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stubborn contributors" }]
keywords = [
    "scip",
    "code-context",
    "llm",
    "stub",
    "dependency-graph",
    "rag",
    "migration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Pre-processors",
]
dependencies = [
    "protobuf>=5.0,<6.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2"]
dev = ["pytest>=8.0,<9.0", "mcp>=1.6,<2"]

[project.scripts]
stubborn = "stubborn.cli:app"
stub = "stubborn.cli:app"
stubborn-mcp = "stubborn.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stubborn"]

[tool.hatch.build.targets.wheel.force-include]
"src/stubborn/store/schema" = "stubborn/store/schema"

[tool.hatch.build.targets.sdist]
include = ["src/stubborn", "README.md", "LICENSE"]

[project.urls]
Homepage = "https://github.com/stubborn-ai/stubborn"
Repository = "https://github.com/stubborn-ai/stubborn"
Issues = "https://github.com/stubborn-ai/stubborn/issues"
Documentation = "https://github.com/stubborn-ai/stubborn#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
