[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stubborn-stub"
version = "0.9.0b6"
description = "Deterministic code context from symbol graphs — not vector search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stubborn contributors" }]
keywords = [
    "scip",
    "code-context",
    "llm",
    "stub",
    "dependency-graph",
    "symbol-graph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Pre-processors",
]
dependencies = [
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "protobuf>=5.29,<6.0",
    "PyYAML>=6.0,<7.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1",
]
openapi = ["PyYAML>=6.0,<7.0"]
scip = ["protobuf>=5.0,<6.0"]

[project.scripts]
stubborn = "stubborn.cli:app"
stub = "stubborn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stubborn"]

[tool.hatch.build.targets.wheel.force-include]
"src/stubborn/fixtures/minimal.json" = "stubborn/fixtures/minimal.json"

[tool.hatch.build.targets.sdist]
include = ["src/stubborn", "README.md", "LICENSE"]

[project.urls]
Homepage = "https://github.com/stubborn-ai/stubborn"
Repository = "https://github.com/stubborn-ai/stubborn"
Issues = "https://github.com/stubborn-ai/stubborn/issues"
Documentation = "https://github.com/stubborn-ai/stubborn#readme"
Changelog = "https://github.com/stubborn-ai/stubborn/releases"
PyPI = "https://pypi.org/project/stubborn-stub/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/stubborn/ingest/scip_proto/scip_pb2.py" = ["ALL"]

[tool.ruff.format]
exclude = ["src/stubborn/ingest/scip_proto/scip_pb2.py"]
