services:
  # Build once: docker compose build
  stubborn:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SCIP_JAVA_VERSION: "0.12.3"
    image: stubborn:e2e

  shell:
    image: stubborn:e2e
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    working_dir: /opt/stubborn
    volumes:
      - .:/opt/stubborn

  cli:
    image: stubborn:e2e
    entrypoint: ["stubborn"]
    working_dir: /workspace
    volumes:
      - .:/opt/stubborn
