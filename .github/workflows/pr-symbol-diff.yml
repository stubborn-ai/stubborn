name: PR symbol diff

on:
  pull_request:
    paths:
      - "examples/fixtures/**"
      - "src/**"
      - ".github/workflows/pr-symbol-diff.yml"

jobs:
  fixture-symbol-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Index minimal fixture (baseline)
        run: stubborn index --scip examples/fixtures/minimal.scip --out /tmp/baseline.db

      - name: Index minimal fixture (candidate)
        run: stubborn index --scip examples/fixtures/minimal.scip --out /tmp/candidate.db

      - name: Reconcile symbol sets
        run: stubborn diff /tmp/baseline.db /tmp/candidate.db

      - name: Run unit tests
        run: pytest -v
